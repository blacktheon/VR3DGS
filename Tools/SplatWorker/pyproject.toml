[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splat-worker"
version = "0.1.0"
description = "Local Stage 1 source inspection, contribution scoring and original-row export"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.2.6", "psutil==7.0.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["splat_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
